<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring — Autonomous Research Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    .mon-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .back-link { color: var(--fg-faint); text-decoration: none; font-size: 13px; }
    .back-link:hover { color: var(--fg-strong); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--fg-faint); font-weight: 500; font-size: 12px; }
    td.num, th.num { text-align: right; font-family: var(--font-mono); font-size: 12.5px; }
    tr:last-child td { border-bottom: none; }
    .mem-tag { font-family: var(--font-mono); font-size: 10px; color: var(--fg-faint); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
    .empty { color: var(--fg-faint); font-size: 13px; padding: 8px 0; }
    .refresh-bar { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 12.5px; color: var(--fg-faint); }
    .refresh-bar button {
      background: color-mix(in oklch, var(--card) 60%, transparent);
      border: 1px solid var(--border); border-radius: 999px;
      color: var(--fg-subtle); font-family: inherit; font-size: 12.5px;
      padding: 5px 12px; cursor: pointer;
    }
    .refresh-bar button:hover { color: var(--fg-strong); border-color: var(--primary); }
  </style>
</head>
<body>
  <div class="aurora">
    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>
    <div class="aurora-blob aurora-blob-3"></div>
  </div>

  <div class="wrap">
    <header class="hero">
      <div class="badge-pill"><span class="dot"></span> Monitoring</div>
      <h1>Chi phí <span class="grad">&amp; hiệu năng</span></h1>
      <p class="lead">Tổng hợp từ log có cấu trúc của pipeline — mỗi bước (plan, search, verify, synthesize) đều được đo token, độ trễ và chi phí.</p>
    </header>

    <div id="content" class="hidden" style="display:flex;flex-direction:column;gap:16px;">
      <div class="card result-card"><div class="metrics" id="totals"></div></div>
      <div class="card result-card"><h2>Theo tầng pipeline</h2><div id="steps"></div></div>
      <div class="card result-card"><h2>Lần chạy gần đây</h2><div id="runs"></div></div>
      <div class="refresh-bar">
        <button id="refresh">Làm mới</button>
        <label><input type="checkbox" id="autorefresh" checked /> tự động mỗi 10 giây</label>
        <span id="updated"></span>
        <a class="back-link" href="/" style="margin-left:auto;">← Quay lại trang hỏi đáp</a>
      </div>
    </div>

    <div id="monStatus" class="status"><span class="spinner"></span> Đang tải số liệu…</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const pct = (x) => `${Math.round((x || 0) * 100)}%`;

    function metric(value, label) {
      return `<div class="metric"><b>${value}</b><span>${label}</span></div>`;
    }

    function render(data) {
      const t = data.totals;
      $("totals").innerHTML =
        metric(data.run_count, "Lần chạy") +
        metric(`$${data.avg_run_cost_usd.toFixed(4)}`, "Chi phí TB / lần") +
        metric(`${(data.avg_run_latency_ms / 1000).toFixed(1)}s`, "Thời gian TB / lần") +
        metric(t.tokens.toLocaleString(), "Tổng token") +
        metric(`$${t.cost_usd.toFixed(4)}`, "Tổng chi phí") +
        metric(t.budget_exceeded, "Lần chạm trần ngân sách");

      $("steps").innerHTML = data.by_step.length
        ? `<table><tr><th>Bước</th><th class="num">Số lần</th><th class="num">Độ trễ TB</th>
           <th class="num">Token</th><th class="num">Chi phí</th></tr>
           ${data.by_step.map((s) => `<tr>
             <td>${esc(s.step)}</td><td class="num">${s.count}</td>
             <td class="num">${s.avg_latency_ms} ms</td>
             <td class="num">${s.tokens.toLocaleString()}</td>
             <td class="num">$${s.cost_usd.toFixed(4)}</td></tr>`).join("")}</table>`
        : `<div class="empty">Chưa có bước nào được ghi.</div>`;

      $("runs").innerHTML = data.runs.length
        ? `<table><tr><th>Report</th><th class="num">Thời gian</th><th class="num">Chi phí</th>
           <th class="num">Mục</th><th class="num">Nguồn</th><th>Khác</th></tr>
           ${data.runs.map((r) => `<tr>
             <td>${esc(r.report_id)}</td>
             <td class="num">${(r.latency_ms / 1000).toFixed(1)}s</td>
             <td class="num">$${r.cost_usd.toFixed(4)}</td>
             <td class="num">${r.sections ?? "-"}</td>
             <td class="num">${r.sources ?? "-"}</td>
             <td>${r.recalled ? '<span class="mem-tag">từ bộ nhớ</span>' : ""}${r.revision ? `<span class="mem-tag">replan ×${r.revision}</span>` : ""}</td>
           </tr>`).join("")}</table>`
        : `<div class="empty">Chưa có lần chạy nào. Đặt một câu hỏi ở trang chủ rồi quay lại đây.</div>`;

      $("content").classList.remove("hidden");
      $("monStatus").classList.add("hidden");
      $("updated").textContent = "cập nhật " + new Date().toLocaleTimeString("vi-VN");
    }

    async function load() {
      try {
        const res = await fetch("/metrics");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render(await res.json());
      } catch (err) {
        $("monStatus").className = "status error";
        $("monStatus").textContent = `Lỗi khi tải số liệu: ${err.message}`;
      }
    }

    $("refresh").addEventListener("click", load);
    setInterval(() => { if ($("autorefresh").checked) load(); }, 10000);
    load();
  </script>
</body>
</html>
